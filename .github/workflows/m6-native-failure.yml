name: M6 Native Failure Fixture

on:
  workflow_dispatch:
    inputs:
      fixture:
        description: "Recorded M6 failure fixture name"
        required: true
        default: "native-failure"

permissions:
  contents: read

jobs:
  native-failure:
    runs-on: ubuntu-latest
    steps:
      - name: Emit a bounded diagnostic fixture
        run: |
          echo "M6_NATIVE_FAILURE_FIXTURE=${{ inputs.fixture }}"
          echo "This workflow intentionally fails for M6 acceptance."
          exit 1
