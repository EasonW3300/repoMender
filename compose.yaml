name: repomender

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: repomender
      POSTGRES_USER: repomender
      POSTGRES_PASSWORD: ${REPOMENDER_POSTGRES_PASSWORD:-repomender-dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repomender -d repomender"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - repomender-postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        GO_BUILD_IMAGE: ${REPOMENDER_GO_BUILD_IMAGE:-golang:1.26-alpine}
        ALPINE_IMAGE: ${REPOMENDER_ALPINE_IMAGE:-alpine:3.22}
        REPOMENDER_VERSION: ${REPOMENDER_SERVICE_VERSION:-dev}
    command: ["api"]
    environment:
      REPOMENDER_DATABASE_URL: postgres://repomender:${REPOMENDER_POSTGRES_PASSWORD:-repomender-dev}@postgres:5432/repomender?sslmode=disable
      REPOMENDER_HTTP_ADDRESS: :8080
      REPOMENDER_PUBLIC_URL: ${REPOMENDER_PUBLIC_URL:-http://localhost:8088}
      REPOMENDER_SESSION_TTL: ${REPOMENDER_SESSION_TTL:-28800}
      REPOMENDER_COOKIE_SECURE: ${REPOMENDER_COOKIE_SECURE:-false}
      REPOMENDER_FEATURE_M10_HARDENING: ${REPOMENDER_FEATURE_M10_HARDENING:-false}
      REPOMENDER_SERVICE_VERSION: ${REPOMENDER_SERVICE_VERSION:-dev}
      REPOMENDER_METRICS_TOKEN: ${REPOMENDER_METRICS_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      REPOMENDER_RETENTION_DAYS: ${REPOMENDER_RETENTION_DAYS:-365}
      REPOMENDER_RATE_LIMIT_PER_MINUTE: ${REPOMENDER_RATE_LIMIT_PER_MINUTE:-120}
      REPOMENDER_BACKUP_DIRECTORY: ${REPOMENDER_BACKUP_DIRECTORY:-/var/lib/repomender/backups}
      REPOMENDER_OIDC_ISSUER: ${REPOMENDER_OIDC_ISSUER:-}
      REPOMENDER_OIDC_CLIENT_ID: ${REPOMENDER_OIDC_CLIENT_ID:-}
      REPOMENDER_OIDC_CLIENT_SECRET: ${REPOMENDER_OIDC_CLIENT_SECRET:-}
      REPOMENDER_FEATURE_M2_SCM: ${REPOMENDER_FEATURE_M2_SCM:-false}
      REPOMENDER_MASTER_KEY: ${REPOMENDER_MASTER_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      REPOMENDER_GITHUB_APP_ID: ${REPOMENDER_GITHUB_APP_ID:-}
      REPOMENDER_GITHUB_APP_SLUG: ${REPOMENDER_GITHUB_APP_SLUG:-}
      REPOMENDER_GITHUB_APP_PRIVATE_KEY_B64: ${REPOMENDER_GITHUB_APP_PRIVATE_KEY_B64:-}
      REPOMENDER_GITHUB_APP_PRIVATE_KEY_FILE: ${REPOMENDER_GITHUB_APP_PRIVATE_KEY_FILE:-}
      REPOMENDER_GITHUB_WEBHOOK_SECRET: ${REPOMENDER_GITHUB_WEBHOOK_SECRET:-}
      REPOMENDER_FEATURE_GITLAB: ${REPOMENDER_FEATURE_GITLAB:-false}
      REPOMENDER_GITLAB_CLIENT_ID: ${REPOMENDER_GITLAB_CLIENT_ID:-}
      REPOMENDER_GITLAB_CLIENT_SECRET: ${REPOMENDER_GITLAB_CLIENT_SECRET:-}
      REPOMENDER_GITLAB_WEBHOOK_SECRET: ${REPOMENDER_GITLAB_WEBHOOK_SECRET:-}
      REPOMENDER_FEATURE_M3_AC_EXECUTION: ${REPOMENDER_FEATURE_M3_AC_EXECUTION:-false}
      REPOMENDER_FEATURE_M4_TASKS: ${REPOMENDER_FEATURE_M4_TASKS:-false}
      REPOMENDER_FEATURE_M5_CODE_REVIEW: ${REPOMENDER_FEATURE_M5_CODE_REVIEW:-false}
      REPOMENDER_FEATURE_M6_CI_DIAGNOSIS: ${REPOMENDER_FEATURE_M6_CI_DIAGNOSIS:-false}
      REPOMENDER_FEATURE_M7_APPROVALS: ${REPOMENDER_FEATURE_M7_APPROVALS:-false}
      REPOMENDER_FEATURE_M8_ISSUE_REPAIR: ${REPOMENDER_FEATURE_M8_ISSUE_REPAIR:-false}
      REPOMENDER_FEATURE_M9_AUTOMATIONS: ${REPOMENDER_FEATURE_M9_AUTOMATIONS:-false}
      REPOMENDER_AC_BASE_URL: ${REPOMENDER_AC_BASE_URL:-}
      REPOMENDER_AC_PROJECT_ID: ${REPOMENDER_AC_PROJECT_ID:-}
      REPOMENDER_AC_AGENT_NAME: ${REPOMENDER_AC_AGENT_NAME:-codex}
      REPOMENDER_AC_AUTH_TOKEN: ${REPOMENDER_AC_AUTH_TOKEN:-}
      REPOMENDER_AC_REQUIRED_VERSION: ${REPOMENDER_AC_REQUIRED_VERSION:-}
      REPOMENDER_AC_REQUIRED_DRIVER: ${REPOMENDER_AC_REQUIRED_DRIVER:-docker}
      REPOMENDER_AC_REQUEST_TIMEOUT: ${REPOMENDER_AC_REQUEST_TIMEOUT:-10}
      REPOMENDER_AC_SENSITIVE_PATTERNS: ${REPOMENDER_AC_SENSITIVE_PATTERNS:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "repomender", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        GO_BUILD_IMAGE: ${REPOMENDER_GO_BUILD_IMAGE:-golang:1.26-alpine}
        ALPINE_IMAGE: ${REPOMENDER_ALPINE_IMAGE:-alpine:3.22}
        REPOMENDER_VERSION: ${REPOMENDER_SERVICE_VERSION:-dev}
    command: ["worker"]
    environment:
      REPOMENDER_DATABASE_URL: postgres://repomender:${REPOMENDER_POSTGRES_PASSWORD:-repomender-dev}@postgres:5432/repomender?sslmode=disable
      REPOMENDER_FEATURE_M2_SCM: ${REPOMENDER_FEATURE_M2_SCM:-false}
      REPOMENDER_MASTER_KEY: ${REPOMENDER_MASTER_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      REPOMENDER_GITHUB_APP_ID: ${REPOMENDER_GITHUB_APP_ID:-}
      REPOMENDER_GITHUB_APP_SLUG: ${REPOMENDER_GITHUB_APP_SLUG:-}
      REPOMENDER_GITHUB_APP_PRIVATE_KEY_B64: ${REPOMENDER_GITHUB_APP_PRIVATE_KEY_B64:-}
      REPOMENDER_GITHUB_APP_PRIVATE_KEY_FILE: ${REPOMENDER_GITHUB_APP_PRIVATE_KEY_FILE:-}
      REPOMENDER_GITHUB_WEBHOOK_SECRET: ${REPOMENDER_GITHUB_WEBHOOK_SECRET:-}
      REPOMENDER_FEATURE_M3_AC_EXECUTION: ${REPOMENDER_FEATURE_M3_AC_EXECUTION:-false}
      REPOMENDER_AC_BASE_URL: ${REPOMENDER_AC_BASE_URL:-}
      REPOMENDER_AC_PROJECT_ID: ${REPOMENDER_AC_PROJECT_ID:-}
      REPOMENDER_AC_AGENT_NAME: ${REPOMENDER_AC_AGENT_NAME:-codex}
      REPOMENDER_AC_AUTH_TOKEN: ${REPOMENDER_AC_AUTH_TOKEN:-}
      REPOMENDER_AC_REQUIRED_VERSION: ${REPOMENDER_AC_REQUIRED_VERSION:-}
      REPOMENDER_AC_REQUIRED_DRIVER: ${REPOMENDER_AC_REQUIRED_DRIVER:-docker}
      REPOMENDER_AC_REQUEST_TIMEOUT: ${REPOMENDER_AC_REQUEST_TIMEOUT:-10}
      REPOMENDER_AC_SENSITIVE_PATTERNS: ${REPOMENDER_AC_SENSITIVE_PATTERNS:-}
      REPOMENDER_FEATURE_M4_TASKS: ${REPOMENDER_FEATURE_M4_TASKS:-false}
      REPOMENDER_FEATURE_M5_CODE_REVIEW: ${REPOMENDER_FEATURE_M5_CODE_REVIEW:-false}
      REPOMENDER_FEATURE_M6_CI_DIAGNOSIS: ${REPOMENDER_FEATURE_M6_CI_DIAGNOSIS:-false}
      REPOMENDER_FEATURE_M7_APPROVALS: ${REPOMENDER_FEATURE_M7_APPROVALS:-false}
      REPOMENDER_FEATURE_M8_ISSUE_REPAIR: ${REPOMENDER_FEATURE_M8_ISSUE_REPAIR:-false}
      REPOMENDER_FEATURE_M9_AUTOMATIONS: ${REPOMENDER_FEATURE_M9_AUTOMATIONS:-false}
      REPOMENDER_FEATURE_M10_HARDENING: ${REPOMENDER_FEATURE_M10_HARDENING:-false}
      REPOMENDER_SERVICE_VERSION: ${REPOMENDER_SERVICE_VERSION:-dev}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      REPOMENDER_RETENTION_DAYS: ${REPOMENDER_RETENTION_DAYS:-365}
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NODE_IMAGE: ${REPOMENDER_NODE_IMAGE:-node:24-alpine}
    depends_on:
      api:
        condition: service_healthy

  gateway:
    image: caddy:2.10-alpine
    ports:
      - "${REPOMENDER_HTTP_PORT:-8088}:8088"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - api

volumes:
  repomender-postgres:
