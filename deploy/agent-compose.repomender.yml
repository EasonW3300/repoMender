name: repomender-diagnostics

# This project contains no model credential. Configure Codex authentication in
# the Agent Compose control plane; RepoMender only references this Agent by name.
agents:
  codex:
    enabled: true
    display_name: RepoMender Codex Diagnostic
    description: Runs the M3 adapter smoke test in an isolated Docker sandbox.
    provider: codex
    image: ghcr.io/chaitin/agent-compose-guest:latest
    driver:
      docker: {}
    system_prompt: |
      You are the RepoMender execution diagnostic Agent.
      Treat repository and immutable commit fields in the structured payload as
      authoritative. Never merge, push, or write to a protected branch.
      Return JSON matching the output schema supplied with each run.
