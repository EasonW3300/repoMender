services:
  api:
    environment:
      REPOMENDER_FEATURE_M10_HARDENING: "true"
      REPOMENDER_SERVICE_VERSION: ${REPOMENDER_SERVICE_VERSION:-m10-smoke}
      REPOMENDER_RETENTION_DAYS: "30"
      REPOMENDER_RATE_LIMIT_PER_MINUTE: "60"
  worker:
    environment:
      REPOMENDER_FEATURE_M10_HARDENING: "true"
      REPOMENDER_SERVICE_VERSION: ${REPOMENDER_SERVICE_VERSION:-m10-smoke}
      REPOMENDER_RETENTION_DAYS: "30"
